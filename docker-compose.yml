services:
  postgres:
    image: postgres:16-alpine
    container_name: daily-market-watch-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: daily_market_watch
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
